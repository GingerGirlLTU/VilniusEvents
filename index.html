<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Vilnius Events</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root {
            --bg-primary: #0A0A0A;
            --bg-secondary: #141414;
            --bg-card: #1C1C1C;
            --accent-yellow: #FFD93D;
            --accent-purple: #A855F7;
            --accent-pink: #EC4899;
            --text-primary: #FFFFFF;
            --text-secondary: #9CA3AF;
            --border-subtle: #2A2A2A;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* Header */
        .header {
            position: sticky;
            top: 0;
            background: linear-gradient(180deg, var(--bg-primary) 0%, rgba(10, 10, 10, 0.95) 100%);
            backdrop-filter: blur(20px);
            z-index: 100;
            padding: max(env(safe-area-inset-top), 16px) 20px 16px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .logo {
            font-family: 'Syne', sans-serif;
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-yellow) 0%, var(--accent-pink) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
        }

        .city-badge {
            background: var(--bg-card);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid var(--border-subtle);
        }

        /* Categories */
        .categories {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            padding-bottom: 4px;
        }

        .categories::-webkit-scrollbar {
            display: none;
        }

        .category-chip {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            padding: 10px 20px;
            border-radius: 24px;
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            flex-shrink: 0;
        }

        .category-chip.active {
            background: var(--accent-yellow);
            color: var(--bg-primary);
            border-color: var(--accent-yellow);
            transform: scale(1.05);
        }

        .category-chip:hover {
            border-color: var(--accent-yellow);
            transform: translateY(-2px);
        }

        /* Main Content */
        .container {
            padding: 24px 20px;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .section-title {
            font-family: 'Syne', sans-serif;
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 20px;
            letter-spacing: -0.5px;
        }

        .date-selector {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            margin-bottom: 32px;
            padding-bottom: 4px;
        }

        .date-selector::-webkit-scrollbar {
            display: none;
        }

        .date-card {
            background: var(--bg-card);
            border: 2px solid var(--border-subtle);
            border-radius: 16px;
            padding: 16px;
            min-width: 80px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            flex-shrink: 0;
        }

        .date-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-purple);
        }

        .date-card.active {
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
            border-color: transparent;
            box-shadow: 0 8px 24px rgba(168, 85, 247, 0.3);
        }

        .date-day {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            opacity: 0.7;
            margin-bottom: 4px;
        }

        .date-number {
            font-size: 24px;
            font-weight: 800;
            font-family: 'Syne', sans-serif;
        }

        /* Event Cards */
        .events-grid {
            display: grid;
            gap: 20px;
            padding-bottom: 100px;
        }

        .event-card {
            background: var(--bg-card);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--border-subtle);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            animation: slideUp 0.6s ease-out backwards;
        }

        .event-card:nth-child(1) { animation-delay: 0.1s; }
        .event-card:nth-child(2) { animation-delay: 0.2s; }
        .event-card:nth-child(3) { animation-delay: 0.3s; }
        .event-card:nth-child(4) { animation-delay: 0.4s; }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .event-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            border-color: var(--accent-yellow);
        }

        .event-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            position: relative;
        }

        .event-image-placeholder {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            position: relative;
            overflow: hidden;
        }

        .event-image-placeholder::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .event-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: var(--accent-yellow);
            color: var(--bg-primary);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 12px rgba(255, 217, 61, 0.3);
        }

        .language-flag {
            position: absolute;
            top: 12px;
            right: 12px;
            font-size: 20px;
            line-height: 1;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        .fav-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.5);
            border: none;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
            transition: all 0.2s ease;
            color: rgba(255, 255, 255, 0.6);
            z-index: 2;
        }

        .fav-btn.active {
            color: #FFD93D;
            background: rgba(255, 217, 61, 0.25);
        }

        .fav-btn:hover {
            transform: scale(1.15);
        }

        .event-content {
            padding: 20px;
        }

        .event-category {
            display: inline-block;
            background: var(--bg-secondary);
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            color: var(--accent-purple);
        }

        .event-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 12px;
            line-height: 1.3;
            font-family: 'Syne', sans-serif;
            letter-spacing: -0.3px;
        }

        .event-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 16px;
        }

        .event-meta-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .event-price {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 16px;
            border-top: 1px solid var(--border-subtle);
        }

        .price-tag {
            font-size: 24px;
            font-weight: 800;
            font-family: 'Syne', sans-serif;
            color: var(--accent-yellow);
        }

        .price-free {
            color: #10B981;
        }

        .btn-book {
            background: linear-gradient(135deg, var(--accent-yellow) 0%, #FFA500 100%);
            color: var(--bg-primary);
            padding: 10px 24px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 14px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-book:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(255, 217, 61, 0.4);
        }

        .btn-book:active {
            transform: scale(0.98);
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-subtle);
            padding: 12px 20px calc(12px + env(safe-area-inset-bottom));
            display: flex;
            justify-content: space-around;
            align-items: center;
            backdrop-filter: blur(20px);
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 8px 16px;
            border-radius: 12px;
        }

        .nav-item:hover {
            background: var(--bg-card);
        }

        .nav-item.active {
            color: var(--accent-yellow);
        }

        .nav-icon {
            font-size: 24px;
        }

        .nav-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Loading Animation */
        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--border-subtle);
            border-top-color: var(--accent-yellow);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Map */
        #map-view {
            position: fixed;
            left: 0;
            right: 0;
            z-index: 50;
            display: none;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        #map-counter {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 20, 20, 0.92);
            color: var(--accent-yellow);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            z-index: 1000;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 217, 61, 0.3);
            white-space: nowrap;
            pointer-events: none;
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
        }

        .leaflet-popup-content-wrapper {
            background: #1C1C1C !important;
            color: #FFFFFF !important;
            border: 1px solid #2A2A2A !important;
            border-radius: 14px !important;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6) !important;
        }

        .leaflet-popup-tip {
            background: #1C1C1C !important;
        }

        .leaflet-popup-content {
            margin: 14px 16px !important;
            color: #FFFFFF;
        }

        .leaflet-container {
            font-family: 'Manrope', sans-serif;
            background: #141414;
        }

        .leaflet-control-attribution {
            background: rgba(0,0,0,0.7) !important;
            color: #9CA3AF !important;
            font-size: 10px !important;
        }

        .leaflet-control-attribution a {
            color: #FFD93D !important;
        }

        .map-popup-btn {
            background: linear-gradient(135deg, #FFD93D, #FFA500);
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            color: #0A0A0A;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Register Button */
        .btn-register {
            background: linear-gradient(135deg, #FFD93D 0%, #FFA500 100%);
            color: #0A0A0A;
            padding: 10px 16px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 13px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 215, 0, 0.4);
        }

        .btn-register:active { transform: scale(0.97); }

        /* Confetti */
        .confetti-piece {
            position: fixed; pointer-events: none;
            z-index: 9999; font-size: 22px;
            animation: confettiFly 1.3s ease-out forwards;
        }

        @keyframes confettiFly {
            0%   { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-220px) scale(0.5) rotate(540deg); opacity: 0; }
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            display: none;
        }

        .empty-state.active {
            display: block;
        }

        .empty-icon {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-text {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <div class="logo">VILNIUS</div>
            <div class="city-badge">📍 Lithuania</div>
        </div>
        <div class="categories" id="categories">
            <div class="category-chip active" data-category="all">Все</div>
            <div class="category-chip" data-category="concert">🎵 Концерты</div>
            <div class="category-chip" data-category="theater">🎭 Театр</div>
            <div class="category-chip" data-category="exhibition">🎨 Выставки</div>
            <div class="category-chip" data-category="club">🎉 Клубы</div>
            <div class="category-chip" data-category="sport">⚽ Спорт</div>
            <div class="category-chip" data-category="other">✨ Другое</div>
        </div>
    </div>

    <div class="container">
        <h2 class="section-title">Когда идём?</h2>
        <div class="date-selector" id="dates">
            <!-- Dates will be generated by JS -->
        </div>

        <h2 class="section-title">События</h2>
        <div class="events-grid" id="events">
            <!-- Events will be loaded here -->
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Загружаем события...</p>
        </div>

        <div class="empty-state" id="empty">
            <div class="empty-icon">🎭</div>
            <p class="empty-text">Событий не найдено</p>
        </div>
    </div>

    <div id="map-view">
        <div id="map"></div>
        <div id="map-counter">📍 Событий на карте: 0</div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" data-tab="events">
            <div class="nav-icon">🎪</div>
            <div class="nav-label">События</div>
        </div>
        <div class="nav-item" data-tab="favorites">
            <div class="nav-icon">⭐</div>
            <div class="nav-label">Избранное</div>
        </div>
        <div class="nav-item" data-tab="map">
            <div class="nav-icon">🗺️</div>
            <div class="nav-label">Карта</div>
        </div>
        <div class="nav-item" data-tab="search">
            <div class="nav-icon">🔍</div>
            <div class="nav-label">Поиск</div>
        </div>
        <div class="nav-item" data-tab="profile">
            <div class="nav-icon">👤</div>
            <div class="nav-label">Профиль</div>
        </div>
    </div>

    <script>
        // Telegram Web App initialization
        let tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        const API_URL = 'https://vilnius-events-api.onrender.com';
let mockEvents = [];

async function loadEventsFromAPI() {
    try {
        const response = await fetch(`${API_URL}/api/events`);
        mockEvents = await response.json();
        mockEvents.forEach(e => eventsById[e.id] = e);
        filterEvents();
    } catch (error) {
        console.error('Error:', error);
    }
}

loadEventsFromAPI();

        let currentCategory = 'all';
        let currentDate = null;
        let currentTab = 'events';
        let currentFilteredEvents = [];
        let eventsById = {};
        let favorites = JSON.parse(localStorage.getItem('favorites') || '[]');

        // Generate dates for the next 7 days
        function generateDates() {
            const datesContainer = document.getElementById('dates');
            const today = new Date();
            const days = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
            
            for (let i = 0; i < 7; i++) {
                const date = new Date(today);
                date.setDate(today.getDate() + i);
                
                const dateCard = document.createElement('div');
                dateCard.className = 'date-card' + (i === 0 ? ' active' : '');
                dateCard.dataset.date = date.toISOString().split('T')[0];
                
                dateCard.innerHTML = `
                    <div class="date-day">${days[date.getDay()]}</div>
                    <div class="date-number">${date.getDate()}</div>
                `;
                
                dateCard.addEventListener('click', () => {
                    document.querySelectorAll('.date-card').forEach(d => d.classList.remove('active'));
                    dateCard.classList.add('active');
                    currentDate = dateCard.dataset.date;
                    filterEvents();
                });
                
                datesContainer.appendChild(dateCard);
            }
            
            currentDate = today.toISOString().split('T')[0];
        }

        const categoryMeta = {
            concert:    { icon: '🎵', gradient: 'linear-gradient(135deg, #667eea, #764ba2)' },
            theater:    { icon: '🎭', gradient: 'linear-gradient(135deg, #f093fb, #f5576c)' },
            exhibition: { icon: '🎨', gradient: 'linear-gradient(135deg, #4facfe, #00f2fe)' },
            club:       { icon: '🎉', gradient: 'linear-gradient(135deg, #43e97b, #38f9d7)' },
            sport:      { icon: '⚽', gradient: 'linear-gradient(135deg, #fa709a, #fee140)' },
            other:      { icon: '✨', gradient: 'linear-gradient(135deg, #a18cd1, #fbc2eb)' },
        };

        // Render events
        function renderEvents(events) {
            const eventsContainer = document.getElementById('events');
            const emptyState = document.getElementById('empty');
            
            eventsContainer.innerHTML = '';
            
            if (events.length === 0) {
                eventsContainer.style.display = 'none';
                emptyState.classList.add('active');
                return;
            }
            
            eventsContainer.style.display = 'grid';
            emptyState.classList.remove('active');
            
            events.forEach(event => {
                const meta = categoryMeta[event.category] || categoryMeta.other;
                event.icon = event.icon || meta.icon;
                event.gradient = event.gradient || meta.gradient;

                const eventCard = document.createElement('div');
                eventCard.className = 'event-card';

                const isFavorite = favorites.includes(event.id);
                const regUrls = parseRegistrationUrls(event.description, event.ticket_url);
                const hasRegUrl = regUrls.length > 0 || !!event.registration_url;
                const hasRegKw = hasRegistrationKeyword(event.description) || !!event.requires_registration;
                const showRegBtn = hasRegUrl || hasRegKw;
                const regUrl = event.registration_url || (regUrls.length > 0 ? regUrls[0].url : null);

                const languageFlags = {
                    'RU': '🇷🇺', 'LT': '🇱🇹', 'EN': '🇬🇧',
                    'BY': '🇧🇾', 'PL': '🇵🇱', 'UA': '🇺🇦'
                };
                const langFlag = languageFlags[event.event_language] || '';

                eventCard.innerHTML = `
                    <div class="event-image-placeholder" style="background: ${event.gradient}">
                        <span style="font-size: 72px;">${event.icon}</span>
                        ${event.is_hot ? '<div class="event-badge">HOT</div>' : ''}
                        ${langFlag ? `<div class="language-flag">${langFlag}</div>` : ''}
                        <button class="fav-btn ${isFavorite ? 'active' : ''}" data-fav-id="${event.id}">${isFavorite ? '★' : '☆'}</button>
                    </div>
                    <div class="event-content">
                        <span class="event-category">${getCategoryName(event.category)}</span>
                        <h3 class="event-title">${event.title}</h3>
                        <div class="event-meta">
                            <div class="event-meta-item">
                                <span>📅</span>
                                <span>${formatDate(event.date)}</span>
                            </div>
                            <div class="event-meta-item">
                                <span>🕐</span>
                                <span>${event.time}</span>
                            </div>
                        </div>
                        <div class="event-meta">
                            <div class="event-meta-item">
                                <span>📍</span>
                                <span>${event.venue}</span>
                            </div>
                        </div>
                        <div class="event-price">
                            <div class="price-tag ${event.price === 0 ? 'price-free' : ''}">
                                ${event.price === 0 ? 'FREE' : `€${event.price}`}
                            </div>
                            <div style="display:flex;gap:8px;align-items:center;">
                                ${showRegBtn ? `<button class="btn-register" data-reg-url="${regUrl || ''}">Зарегаться</button>` : ''}
                                <button class="btn-book" onclick="bookEvent(${event.id})">Купить</button>
                            </div>
                        </div>
                    </div>
                `;

                eventCard.querySelector('.fav-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    toggleFavorite(event.id, e.currentTarget);
                });

                if (showRegBtn) {
                    eventCard.querySelector('.btn-register').addEventListener('click', (e) => {
                        e.stopPropagation();
                        handleRegistration(regUrl, e);
                    });
                }

                eventCard.addEventListener('click', (e) => {
                    if (!e.target.classList.contains('btn-book') &&
                        !e.target.classList.contains('btn-register')) {
                        showEventDetails(event);
                    }
                });

                eventsContainer.appendChild(eventCard);
            });
        }

        // Filter events
        function filterEvents() {
            let filtered = mockEvents;

            if (currentCategory !== 'all') {
                filtered = filtered.filter(e => e.category === currentCategory);
            }
            if (currentDate) {
                filtered = filtered.filter(e => e.date === currentDate);
            }

            currentFilteredEvents = filtered;

            if (currentTab === 'map') {
                updateMapMarkers(filtered);
            } else {
                renderEvents(filtered);
            }
        }

        // Category selection
        document.getElementById('categories').addEventListener('click', (e) => {
            if (e.target.classList.contains('category-chip')) {
                document.querySelectorAll('.category-chip').forEach(c => c.classList.remove('active'));
                e.target.classList.add('active');
                currentCategory = e.target.dataset.category;
                filterEvents();
            }
        });

        // Bottom navigation
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', () => {
                document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                
                const tab = item.dataset.tab;
                handleTabChange(tab);
            });
        });

        function handleTabChange(tab) {
            currentTab = tab;

            if (tab === 'map') {
                showMapView();
            } else {
                hideMapView();
                if (tab === 'favorites') {
                    const favoriteEvents = mockEvents.filter(e => favorites.includes(e.id));
                    currentFilteredEvents = favoriteEvents;
                    renderEvents(favoriteEvents);
                } else if (tab === 'events') {
                    filterEvents();
                } else {
                    tg.showAlert(`Раздел "${tab}" в разработке`);
                }
            }
        }

        // Helper functions
        function getCategoryName(category) {
            const names = {
                concert: 'Концерт',
                theater: 'Театр',
                exhibition: 'Выставка',
                club: 'Клуб',
                sport: 'Спорт',
                other: 'Другое'
            };
            return names[category] || category;
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            const day = date.getDate();
            const months = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
            return `${day} ${months[date.getMonth()]}`;
        }

        function showEventDetails(event) {
            const message = `
📌 ${event.title}

📅 ${formatDate(event.date)} в ${event.time}
📍 ${event.venue}
💰 ${event.price === 0 ? 'Бесплатно' : `€${event.price}`}

Хотите купить билет?
            `.trim();
            
            tg.showConfirm(message, (confirmed) => {
                if (confirmed) {
                    bookEvent(event.id);
                }
            });
        }

        function toggleFavorite(eventId, btn) {
            const idx = favorites.indexOf(eventId);
            if (idx === -1) {
                favorites.push(eventId);
                btn.textContent = '★';
                btn.classList.add('active');
            } else {
                favorites.splice(idx, 1);
                btn.textContent = '☆';
                btn.classList.remove('active');
            }
            localStorage.setItem('favorites', JSON.stringify(favorites));
            updateFavCount();

            const activeTab = document.querySelector('.nav-item.active')?.dataset.tab;
            if (activeTab === 'favorites') {
                handleTabChange('favorites');
            }
        }

        function updateFavCount() {
            const count = favorites.length;
            const label = document.querySelector('[data-tab="favorites"] .nav-label');
            label.textContent = count > 0 ? `Избранное (${count})` : 'Избранное';
        }

        function bookEvent(eventId) {
            const event = mockEvents.find(e => e.id === eventId);
            tg.showAlert(`Покупка билета на "${event.title}" - функция в разработке!`);
            
            // Here you would integrate with your backend
            // tg.sendData(JSON.stringify({ action: 'book', eventId }));
        }

        // ── REGISTRATION ─────────────────────────────────────────────
        function hasRegistrationKeyword(text) {
            if (!text) return false;
            const keywords = ['регистрац', 'зарегистрир', 'записат', 'запись обязательна',
                              'registration', 'register', 'sign up', 'signup', 'rsvp'];
            return keywords.some(kw => text.toLowerCase().includes(kw));
        }

        function parseRegistrationUrls(description, ticketUrl) {
            const seen = new Set();
            const results = [];
            const add = (url) => {
                const clean = url.replace(/[.,;:!?)>\"\']+$/, '');
                if (clean && !seen.has(clean)) { seen.add(clean); results.push({ url: clean }); }
            };
            if (ticketUrl) add(ticketUrl);
            if (description) {
                (description.match(/https?:\/\/[^\s\)\]>"']+/g) || []).forEach(add);
            }
            return results;
        }

        function handleRegistration(url, e) {
            try { tg.HapticFeedback.impactOccurred('medium'); } catch {}
            if (url) {
                triggerConfetti(e);
                setTimeout(() => window.open(url, '_blank'), 300);
            } else {
                tg.showAlert('Для регистрации смотри описание события или свяжись с организаторами.');
            }
        }

        function triggerConfetti(e) {
            const emojis = ['🎉', '✨', '🎊', '⭐', '🎈', '🎁'];
            const x = e.clientX ?? window.innerWidth / 2;
            const y = e.clientY ?? window.innerHeight / 2;
            for (let i = 0; i < 10; i++) {
                const el = document.createElement('div');
                el.className = 'confetti-piece';
                el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                el.style.left = (x + (Math.random() - 0.5) * 120) + 'px';
                el.style.top  = y + 'px';
                el.style.animationDelay = (Math.random() * 0.25) + 's';
                el.style.animationDuration = (0.9 + Math.random() * 0.6) + 's';
                document.body.appendChild(el);
                setTimeout(() => el.remove(), 1800);
            }
        }
        // ── END REGISTRATION ─────────────────────────────────────────

        // ── MAP ──────────────────────────────────────────────────────
        let leafletMap = null;
        let mapMarkers = [];

        const categoryColors = {
            concert:    '#FF6B6B',
            theater:    '#4ECDC4',
            exhibition: '#95E77D',
            club:       '#A855F7',
            sport:      '#FF9F43',
            other:      '#9CA3AF'
        };

        function initMap() {
            if (leafletMap) return;
            leafletMap = L.map('map', { zoomControl: true }).setView([54.6872, 25.2797], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
                maxZoom: 19
            }).addTo(leafletMap);
        }

        function createMarkerIcon(category) {
            const color = categoryColors[category] || categoryColors.other;
            const icon = (categoryMeta[category] || categoryMeta.other).icon;
            return L.divIcon({
                className: '',
                html: `<div style="width:38px;height:38px;border-radius:50%;background:${color};border:3px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;font-size:17px;">${icon}</div>`,
                iconSize: [38, 38],
                iconAnchor: [19, 19],
                popupAnchor: [0, -22]
            });
        }

        // Geocoding queue
        const geocodeQueue = [];
        let geocodingActive = false;

        function geocodeVenue(venue) {
            const key = `geocode_${venue}`;
            const cached = localStorage.getItem(key);
            if (cached !== null) return Promise.resolve(JSON.parse(cached));
            return new Promise(resolve => {
                geocodeQueue.push({ venue, resolve });
                if (!geocodingActive) processGeocodeQueue();
            });
        }

        async function processGeocodeQueue() {
            if (geocodeQueue.length === 0) { geocodingActive = false; return; }
            geocodingActive = true;
            const { venue, resolve } = geocodeQueue.shift();
            const key = `geocode_${venue}`;
            try {
                const q = encodeURIComponent(`${venue}, Vilnius, Lithuania`);
                const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${q}&limit=1`);
                const data = await res.json();
                const result = data.length > 0 ? { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) } : null;
                localStorage.setItem(key, JSON.stringify(result));
                resolve(result);
            } catch {
                resolve(null);
            }
            setTimeout(processGeocodeQueue, 1000);
        }

        async function updateMapMarkers(events) {
            if (!leafletMap) return;
            mapMarkers.forEach(m => m.remove());
            mapMarkers = [];
            document.getElementById('map-counter').textContent = `📍 Событий на карте: 0`;

            let placed = 0;
            const promises = events.map(async event => {
                const venue = event.venue || event.address;
                if (!venue || venue === 'Vilnius') return;
                const coords = await geocodeVenue(venue);
                if (!coords) return;

                const markerIcon = createMarkerIcon(event.category);
                const marker = L.marker([coords.lat, coords.lng], { icon: markerIcon }).addTo(leafletMap);

                const meta = categoryMeta[event.category] || categoryMeta.other;
                const price = event.price === 0 ? 'Бесплатно' : `€${event.price}`;
                marker.bindPopup(`
                    <div style="min-width:200px;">
                        <div style="font-size:14px;font-weight:700;margin-bottom:8px;line-height:1.3;">${meta.icon} ${event.title}</div>
                        <div style="font-size:12px;color:#9CA3AF;margin-bottom:3px;">📅 ${formatDate(event.date)} в ${event.time}</div>
                        <div style="font-size:12px;color:#9CA3AF;margin-bottom:3px;">💰 ${price}</div>
                        <div style="font-size:12px;color:#9CA3AF;">📍 ${venue}</div>
                        <button class="map-popup-btn" onclick="showEventDetails(eventsById[${event.id}])">Подробнее</button>
                    </div>
                `);

                mapMarkers.push(marker);
                placed++;
                document.getElementById('map-counter').textContent = `📍 Событий на карте: ${placed}`;
            });

            await Promise.all(promises);
        }

        function showMapView() {
            initMap();
            const headerH = document.querySelector('.header').offsetHeight;
            const navH = document.querySelector('.bottom-nav').offsetHeight;
            const mapView = document.getElementById('map-view');
            mapView.style.top = headerH + 'px';
            mapView.style.bottom = navH + 'px';
            mapView.style.display = 'block';
            document.querySelector('.container').style.display = 'none';
            setTimeout(() => {
                leafletMap.invalidateSize();
                updateMapMarkers(currentFilteredEvents);
            }, 150);
        }

        function hideMapView() {
            document.getElementById('map-view').style.display = 'none';
            document.querySelector('.container').style.display = 'block';
        }
        // ── END MAP ──────────────────────────────────────────────────

        // Initialize
        generateDates();
        filterEvents();
        updateFavCount();

        // Apply Telegram theme colors
        if (tg.themeParams) {
            document.documentElement.style.setProperty('--tg-theme-bg', tg.themeParams.bg_color || '#0A0A0A');
            document.documentElement.style.setProperty('--tg-theme-text', tg.themeParams.text_color || '#FFFFFF');
        }

        // Send ready signal to bot
        tg.MainButton.setText('Создать событие');
        tg.MainButton.onClick(() => {
            tg.showAlert('Создание событий - функция для администраторов');
        });
    </script>
</body>
</html>
